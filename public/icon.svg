<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Light blush background with rounded corners for app icon -->
  <rect width="512" height="512" rx="128" fill="#FFF0F5" />
  
  <g transform="translate(56, 56) scale(4)">
    <!-- Subtle incomplete circular rhythm arc (Watermelon pink #FB6F92) -->
    <path d="M 21 68 A 38 38 0 1 1 79 68" stroke="#FB6F92" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Distinctive V monogram: two smooth, gently curved shapes (Deep rose #A4365A) -->
    <path d="M 31 27 C 33 46, 44 64, 50 71" stroke="#A4365A" stroke-width="8.5" stroke-linecap="round" />
    <path d="M 50 71 C 56 64, 67 46, 69 27" stroke="#A4365A" stroke-width="8.5" stroke-linecap="round" />
  </g>
</svg>
