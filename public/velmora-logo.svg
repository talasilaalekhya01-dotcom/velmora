<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" fill="none">
  <!-- Velmora Single Scalable Brand Logo Lockup -->
  <!-- Brand colors: Deep Rose #A4365A, Watermelon Pink #FB6F92, Deep Plum #392332 -->
  
  <!-- Symbol: Distinctive V Monogram with Incomplete Circular Rhythm Arc -->
  <g transform="translate(6, 6) scale(0.44)" id="velmora-symbol">
    <!-- Incomplete circular rhythm arc (Watermelon pink #FB6F92) -->
    <path
      d="M 21 68 A 38 38 0 1 1 79 68"
      stroke="#FB6F92"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- Two smooth, gently curved shapes forming the V (Deep rose #A4365A) -->
    <path
      d="M 31 27 C 33 46, 44 64, 50 71"
      stroke="#A4365A"
      stroke-width="9"
      stroke-linecap="round"
    />
    <path
      d="M 50 71 C 56 64, 67 46, 69 27"
      stroke="#A4365A"
      stroke-width="9"
      stroke-linecap="round"
    />
  </g>

  <!-- Wordmark: Velmora (Deep plum #392332) -->
  <text
    x="62"
    y="36"
    fill="#392332"
    font-family="Plus Jakarta Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.03em"
    dominant-baseline="middle"
  >Velmora</text>
</svg>
